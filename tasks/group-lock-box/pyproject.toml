[project]
name = "lockbox-sim"
version = "0.1.0"
description = "Group lock box: drop a job lock's key into a group lock box and add your padlock; task file for yam-isaac-lab-arena's station (props, mechanics, scripted demo)"
requires-python = ">=3.12,<3.13"
license = "MIT"
# Isaac Sim, Isaac Lab-Arena 0.3.1 and yam-arena come from the launchable; install with --no-deps.
dependencies = ["inspect-robots>=0.60", "yam-arena"]

[project.entry-points."inspect_robots.policies"]
lockbox-demo = "lockbox_sim.policy:lockbox_demo"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lockbox_sim"]
