[project]
name = "locktag-sim"
version = "0.1.0"
description = "Lock and tag out a disconnect handle: task file for yam-isaac-lab-arena's station (props, mechanics, scripted demo)"
requires-python = ">=3.12,<3.13"
license = "MIT"
# Isaac Sim, Isaac Lab-Arena 0.3.1 and yam-arena come from the launchable; install with --no-deps.
dependencies = ["inspect-robots>=0.60", "yam-arena"]

[project.entry-points."inspect_robots.policies"]
lock-tag-demo = "locktag_sim.policy:lock_tag_demo"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["locktag_sim"]
